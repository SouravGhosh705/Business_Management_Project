<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>KRYSAV : LOGIN</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link rel="stylesheet" href="" th:href="@{/css/Navigation.css}" />
	<link rel="stylesheet" href="" th:href="@{/css/Login.css}" />
</head>

<body>
	<nav th:replace="~{Navigation::navbar()}"></nav>
	
	<div class="page-background"></div>
	
	<div class="auth-container">
		<div class="auth-wrapper">
			<!-- Admin Login Section -->
			<div class="auth-panel admin-panel">
				<div class="panel-header">
					<div class="panel-icon">
						<i class="fas fa-shield-alt"></i>
					</div>
					<h2>Administrator</h2>
					<p>Access Management Panel</p>
				</div>
				
				<form action="" th:action="@{/adminLogin}" class="auth-form">
					<div class="form-group">
						<label for="admin-email">
							<i class="fas fa-envelope"></i> Email Address
						</label>
						<input type="email" id="admin-email" name="email" placeholder="admin@example.com" required>
					</div>

					<div class="form-group">
						<label for="admin-password">
							<i class="fas fa-lock"></i> Password
						</label>
						<input type="password" id="admin-password" name="password" placeholder="Enter your password" required>
					</div>

					<div class="error-message" th:if="${error}" th:text="${error}"></div>
					
					<button type="submit" class="submit-btn">
						<i class="fas fa-sign-in-alt"></i> Sign In as Admin
					</button>
				</form>
			</div>

			<!-- User Login Section -->
			<div class="auth-panel user-panel">
				<div class="panel-header">
					<div class="panel-icon">
						<i class="fas fa-user-circle"></i>
					</div>
					<h2>User Account</h2>
					<p>Shop & Place Orders</p>
				</div>

				<form action="" th:action="@{/userlogin}" class="auth-form">
					<div class="form-group">
						<label for="user-email">
							<i class="fas fa-envelope"></i> Email Address
						</label>
						<input type="email" id="user-email" name="userEmail" placeholder="user@example.com" required>
					</div>

					<div class="form-group">
						<label for="user-password">
							<i class="fas fa-lock"></i> Password
						</label>
						<input type="password" id="user-password" name="userPassword" placeholder="Enter your password" required maxlength="8" minlength="4">
					</div>

					<div class="error-message" th:if="${error2}" th:text="${error2}"></div>
					
					<button type="submit" class="submit-btn">
						<i class="fas fa-sign-in-alt"></i> Sign In as User
					</button>

					<div class="form-divider">
						<span>New to KRYSAV?</span>
					</div>

					<a href="/Add_User" class="register-btn">
						<i class="fas fa-user-plus"></i> Create New Account
					</a>
				</form>
			</div>
		</div>
	</div>

	<footer class="auth-footer">
		<div class="footer-content">
			<p>&copy; 2026 <strong>KRYSAV</strong> - Premium Business Solutions</p>
			<p>Created by <strong>Sourav Ghosh</strong></p>
			<div class="footer-links">
				<a href="/home">Home</a>
				<a href="/about">About</a>
				<a href="/location">Contact</a>
			</div>
		</div>
	</footer>
</body>

</html>
